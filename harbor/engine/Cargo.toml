[package]
name = "harbor-engine"
version = "0.5.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
anyhow = "1"
arc-swap = "1"
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ipnet = { version = "2", features = ["serde"] }
rand = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
sha1 = "0.10"
md-5 = "0.10"
hickory-proto = "0.26.2"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", features = ["sink"] }
uuid = "1"
aes = "0.8"
crc32fast = "1"
sha3 = "0.10"
zeroize = "1"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "proto-ipv4-fragmentation", "proto-ipv6-fragmentation", "socket-tcp", "socket-udp", "socket-icmp"] }
blake3 = "1"

[target.'cfg(windows)'.dependencies]
wintun = "0.5"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Threading"] }

[dev-dependencies]
rcgen = "0.14"
